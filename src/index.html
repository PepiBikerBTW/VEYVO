<!doctype html>
<html lang="cs" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0D0E11">
  <title>VEYVO</title>
  <link rel="icon" href="../assets/veyvo-icon.png">
  <link rel="stylesheet" href="styles/fonts.css">
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/shell.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/motion.css">
  <!-- page styles: one file per page module, owned by that module (prefix in brackets) -->
  <link rel="stylesheet" href="styles/pages/home.css">          <!-- home- -->
  <link rel="stylesheet" href="styles/pages/plan.css">          <!-- plan- -->
  <link rel="stylesheet" href="styles/pages/progress.css">      <!-- prog- -->
  <link rel="stylesheet" href="styles/pages/nutrition.css">     <!-- nut- -->
  <link rel="stylesheet" href="styles/pages/run-dialog.css">    <!-- rd- -->
  <link rel="stylesheet" href="styles/pages/recovery.css">      <!-- rec- -->
  <link rel="stylesheet" href="styles/pages/workout-sheet.css"> <!-- ws- -->
  <link rel="stylesheet" href="styles/pages/settings.css">      <!-- set- -->
  <link rel="stylesheet" href="styles/pages/onboarding.css">    <!-- onb- -->
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="ui.skip">Přeskočit na obsah</a>

  <div class="app" id="app">
    <!-- Sidebar (desktop + tablet). The brand row is the window drag area; nothing inside it is interactive. -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img class="brand-mark" src="../assets/veyvo-icon.png" alt="" width="28" height="28">
        <span class="brand-name">VEYVO</span>
      </div>

      <button type="button" class="btn btn-side" data-action="log-run">
        <span data-icon="plus"></span>
        <span class="side-label" data-i18n="ui.nav.log">Zapsat běh</span>
        <kbd class="kbd" aria-hidden="true">N</kbd>
      </button>

      <nav class="nav" id="nav" aria-label="Hlavní navigace" data-i18n-attr="aria-label:ui.nav.label">
        <span class="nav-lane" aria-hidden="true"></span>
        <a class="nav-item" href="#home" data-nav="home"><span data-icon="home"></span><span class="side-label" data-i18n="ui.nav.home">Přehled</span></a>
        <a class="nav-item" href="#plan" data-nav="plan"><span data-icon="calendar"></span><span class="side-label" data-i18n="ui.nav.plan">Můj plán</span><span class="nav-badge" data-slot="next-badge" hidden></span></a>
        <a class="nav-item" href="#progress" data-nav="progress"><span data-icon="trend"></span><span class="side-label" data-i18n="ui.nav.progress">Výkonnost</span></a>
        <a class="nav-item" href="#nutrition" data-nav="nutrition"><span data-icon="checklist"></span><span class="side-label" data-i18n="ui.nav.nutrition">Před během</span></a>
      </nav>

      <div class="side-foot">
        <div data-slot="connection" hidden></div>
        <button type="button" class="nav-item" data-action="settings"><span data-icon="settings"></span><span class="side-label" data-i18n="ui.nav.settings">Nastavení</span></button>
        <div class="me" data-slot="profile"></div>
      </div>
    </aside>

    <div class="main-col">
      <!-- Topbar: window drag area on desktop (interactive children are no-drag), compact header on phones. -->
      <header class="topbar" id="topbar">
        <img class="m-brand m-only" src="../assets/veyvo-icon.png" alt="" width="26" height="26">
        <div class="topbar-titles">
          <h1 class="page-title" id="page-title" tabindex="-1">Přehled</h1>
          <p class="topbar-date" data-slot="date"></p>
        </div>
        <div class="topbar-actions" data-slot="topbar-actions"></div>
        <button type="button" class="m-profile m-only" data-action="more" data-slot="m-profile" aria-label="Více"></button>
      </header>

      <main class="main-scroll" id="main" tabindex="-1">
        <section class="page" data-page="home" aria-labelledby="page-title" hidden></section>
        <section class="page" data-page="plan" aria-labelledby="page-title" hidden></section>
        <section class="page" data-page="progress" aria-labelledby="page-title" hidden></section>
        <section class="page" data-page="nutrition" aria-labelledby="page-title" hidden></section>
      </main>
    </div>

    <!-- Bottom tab bar (phones, <= 760 px). -->
    <nav class="tabbar" id="tabbar" aria-label="Hlavní navigace" data-i18n-attr="aria-label:ui.nav.label">
      <a class="tab" href="#home" data-nav="home"><span data-icon="home"></span><span data-i18n="ui.tab.home">Přehled</span></a>
      <a class="tab" href="#plan" data-nav="plan"><span data-icon="calendar"></span><span data-i18n="ui.tab.plan">Plán</span></a>
      <button type="button" class="tab tab-log" data-action="log-run"><span class="tab-plus"><span data-icon="plus"></span></span><span data-i18n="ui.tab.log">Zapsat</span></button>
      <a class="tab" href="#progress" data-nav="progress"><span data-icon="trend"></span><span data-i18n="ui.tab.progress">Výkonnost</span></a>
      <button type="button" class="tab" data-action="more"><span data-icon="more"></span><span data-i18n="ui.tab.more">Více</span></button>
    </nav>
  </div>

  <div id="dialog-root"></div>
  <div class="toast-region" id="toast-root" aria-live="polite" aria-atomic="false"></div>

  <!-- build channel first: 'github' here, rewritten to 'play' by mobile/scripts/sync-web.mjs -->
  <script src="build-info.js"></script>
  <!-- core (pure, UMD) -->
  <script src="vendor/workoutkit.js"></script>
  <script src="core/format.js"></script>
  <script src="core/i18n.js"></script>
  <script src="core/runs-model.js"></script>
  <script src="core/store.js"></script>
  <script src="core/workouts.js"></script>
  <script src="core/export/fit.js"></script>
  <script src="core/export/apple.js"></script>
  <script src="core/export/zwo.js"></script>
  <script src="core/export/intervals.js"></script>
  <script src="training-context.js"></script>
  <script src="nutrition-context.js"></script>
  <script src="platform.js"></script>
  <!-- UI runtime -->
  <script src="ui/dom.js"></script>
  <script src="ui/icons.js"></script>
  <script src="ui/motion.js"></script>
  <script src="ui/charts.js"></script>
  <script src="ui/app.js"></script>
  <!-- page modules (each registers itself with VeyvoUI.app) -->
  <script src="ui/home.js"></script>
  <script src="ui/plan.js"></script>
  <script src="ui/progress.js"></script>
  <script src="ui/run-dialog.js"></script>
  <script src="ui/recovery.js"></script>
  <script src="ui/workout-sheet.js"></script>
  <script src="ui/settings.js"></script>
  <script src="ui/onboarding.js"></script>
  <script src="ui/nutrition.js"></script>
  <!-- last -->
  <script src="ui/boot.js"></script>
</body>
</html>
