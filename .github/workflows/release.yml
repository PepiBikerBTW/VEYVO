name: Build VEYVO release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis --config.win.artifactName='VEYVO-Setup-${version}-${arch}.${ext}' --publish never
      - run: npx electron-builder --win portable --config.win.artifactName='VEYVO-Portable-${version}-${arch}.${ext}' --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.blockmap
            release/*.yml
